<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Meteograma · La Línea</title><style>
body{margin:0;background:#fff8df;color:#473b2a;font:16px/1.5 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:12px}img{display:block;width:100%;height:auto}a{color:#285b72}#estado{padding:10px;background:#fffdf6;border:1px solid #ded2ab}#estado:empty{display:none}details{margin:12px 0}button{font:inherit;padding:6px 12px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px;border:1px solid #d5c8a3;text-align:center}th:first-child{text-align:left}.scroll{overflow-x:auto}.Mayor{background:#d9ead3}.Intermedio{background:#fff0bf}.Poco{background:#f4d6ca}
</style></head><body><main><p id="estado" role="status">Comprobando actualización…</p><img id="grafico" src="meteograma.png" alt="Meteograma de La Línea: temperatura, dirección y velocidad del viento, acumulación de lluvia y escenarios con lluvia. La interpretación y el acuerdo diario también están disponibles en texto debajo."><details><summary>Ver interpretación y acuerdo diario en texto</summary><div id="texto"></div><div class="scroll" id="tabla"></div></details><p><a id="descarga" href="meteograma.png" target="_blank" rel="noopener">Abrir imagen a tamaño completo</a> · <button id="actualizar" type="button">Comprobar actualización</button></p><p><small>Datos ECMWF vía Open-Meteo. Acuerdo orientativo calculado mediante reglas, sin IA. Las horas son UTC.</small></p></main><script>
'use strict';
const el=id=>document.getElementById(id);
async function refresh(){
 try{
  const stamp=Date.now();const r=await fetch('estadisticas.json?t='+stamp,{cache:'no-store'});if(!r.ok)throw Error('metadatos');const s=await r.json();
  const consulted=Date.parse(s.consulted_at_utc),end=Date.parse(s.end_utc);if(!Number.isFinite(consulted)||!Number.isFinite(end))throw Error('fecha');
  const fmt=v=>new Intl.DateTimeFormat('es-ES',{timeZone:'UTC',dateStyle:'short',timeStyle:'short'}).format(new Date(v))+' UTC';
  let text='Última consulta: '+fmt(consulted)+'. Cobertura hasta '+fmt(end)+'.';
  if(end<Date.now())text+=' PREVISIÓN CADUCADA: no hay horas futuras disponibles.';
  else if(Date.now()-consulted>8*3600000)text+=' Actualización retrasada: consulta la fecha antes de usar la previsión.';
  el('estado').textContent=text;
  const src='meteograma.png?v='+encodeURIComponent(s.consulted_at_utc);if(el('grafico').getAttribute('src')!==src)el('grafico').src=src;el('descarga').href=src;
  el('texto').replaceChildren();for(const line of s.summary.split('\n')){const p=document.createElement('p');p.textContent=line;el('texto').append(p);}
  const dr=await fetch('acuerdo_por_dia.json?t='+stamp,{cache:'no-store'});if(!dr.ok)throw Error('tabla');const d=await dr.json();
  const table=document.createElement('table'),head=document.createElement('tr');for(const label of ['Variable',...d.days.map(x=>x.date_utc)]){const th=document.createElement('th');th.textContent=label;head.append(th);}table.append(head);
  for(const label of Object.keys(d.days[0].agreement)){const tr=document.createElement('tr'),th=document.createElement('th');th.textContent=label;tr.append(th);for(const day of d.days){const td=document.createElement('td');td.textContent=day.agreement[label];if(['Mayor','Intermedio','Poco'].includes(td.textContent))td.className=td.textContent;tr.append(td);}table.append(tr);}el('tabla').replaceChildren(table);
 }catch(error){el('estado').textContent='No se ha podido comprobar la actualización. Revisa la fecha impresa en el gráfico.';}
}
el('grafico').addEventListener('error',()=>{el('estado').textContent='Imagen no disponible. Comprueba que la generación y la publicación hayan terminado correctamente.';});el('actualizar').addEventListener('click',refresh);refresh();setInterval(()=>{if(!document.hidden)refresh();},300000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
</script></body></html>
